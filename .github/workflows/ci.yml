name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pandoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install pandoc (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install pandoc --no-progress -y
          echo "C:/Program Files/Pandoc" >> "$GITHUB_PATH"

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build fat jar
        run: ./gradlew bootJar --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: build/reports/tests/test

      - name: Upload jar
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mail-mcp-server
          path: build/libs/mail-mcp-server.jar
