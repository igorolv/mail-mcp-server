name: Release

# Push a tag like v0.1.0 to build the fat jar and publish it as a GitHub Release, with the notes in
# .github/release-notes/<tag>.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Resolve version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check release notes exist
        run: test -s ".github/release-notes/${GITHUB_REF_NAME}.md"

      - name: Run unit tests
        run: ./gradlew test --no-daemon -Pversion=${{ steps.version.outputs.value }}

      - name: Build fat jar
        run: ./gradlew bootJar --no-daemon -Pversion=${{ steps.version.outputs.value }}

      - name: Attach checksum
        run: |
          cd build/libs
          sha256sum mail-mcp-server.jar > mail-mcp-server.jar.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            build/libs/mail-mcp-server.jar
            build/libs/mail-mcp-server.jar.sha256
